<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your CareMate email</title>
  </head>
  <body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px 28px;border:1px solid #e2e8f0;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#0d9488;font-weight:700;">CareMate</p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Confirm your email</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.55;color:#475569;">
                  Enter this verification code in the CareMate app to finish creating your account.
                </p>
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#64748b;font-weight:600;">
                  Verification code
                </p>
                <p style="margin:0 0 24px;font-size:32px;letter-spacing:0.28em;font-weight:700;color:#0f766e;">
                  {{ .Token }}
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#94a3b8;">
                  This code expires in one hour. If you did not create a CareMate account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
