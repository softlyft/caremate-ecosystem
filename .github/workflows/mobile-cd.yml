# Continuous delivery for the CareMate mobile app.
# After CI succeeds on main/master, build an Android APK locally (expo prebuild +
# Gradle) — same path as a local release APK — and attach it as an artifact.
# No EAS / EXPO_TOKEN.
name: Mobile CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: mobile-cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Android APK · Local Gradle · Artifact
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      EXPO_NO_TELEMETRY: 1
      # Optional — app runs in guest mode if unset (same as local without .env).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_CURRENTS_API_KEY: ${{ secrets.EXPO_PUBLIC_CURRENTS_API_KEY }}
      EXPO_PUBLIC_CURRENTS_COUNTRY: ${{ secrets.EXPO_PUBLIC_CURRENTS_COUNTRY || 'INT' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Build the exact commit CI validated (workflow_run defaults to the
          # default branch tip otherwise).
          ref: ${{ env.BUILD_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        working-directory: caremate
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build release APK
        working-directory: caremate/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Matches local Expo release signing (debug keystore) until a
          # Play upload keystore is wired in.
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          SRC="caremate/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "APK not found at $SRC"
            find caremate/android/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          SHA7="$(echo "$BUILD_SHA" | cut -c1-7)"
          NAME="CareMate-${SHA7}.apk"
          mkdir -p artifacts
          cp "$SRC" "artifacts/$NAME"
          ls -lh "artifacts/$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caremate-android-apk
          path: artifacts/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
