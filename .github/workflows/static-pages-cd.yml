# Cloudflare Pages CD — website + payment (static Vite apps).
# Merge / push to `prod` → GitHub Environment `prod` → Cloudflare Pages production deploy.
#
# Create GitHub Environment `prod` with the secrets/vars below (same pattern as Gateway CD).
# Create two Cloudflare Pages projects (Direct Upload; production branch = `prod`):
#   - caremate-website
#   - caremate-payment
#
# Secrets (Environment `prod`):
#   CLOUDFLARE_API_TOKEN          — Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL             — payment build
#   VITE_SUPABASE_ANON_KEY        — payment build
#
# Variables (optional, Environment `prod`):
#   CLOUDFLARE_PAGES_PROJECT_WEBSITE  — default caremate-website
#   CLOUDFLARE_PAGES_PROJECT_PAYMENT  — default caremate-payment
#   VITE_SITE_URL                     — default https://getcaremate.com
#   VITE_COMMUNITY_PORTAL_URL         — default https://community.getcaremate.com
#   VITE_PAYMENT_SITE_URL             — default https://pay.getcaremate.com
#   VITE_WEBSITE_URL                  — default https://getcaremate.com (payment → marketing site)
name: Static Pages CD

on:
  push:
    branches:
      - prod
    paths:
      - 'caremate-website/**'
      - 'caremate-payment-gateway/**'
      - '.github/workflows/static-pages-cd.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Which app(s) to deploy
        required: true
        type: choice
        default: all
        options:
          - all
          - website
          - payment

concurrency:
  group: static-pages-cd-prod
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  resolve:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.t.outputs.website }}
      payment: ${{ steps.t.outputs.payment }}
    steps:
      - name: Decide targets
        id: t
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.target }}"
          if [ -z "$INPUT" ]; then
            INPUT="all"
          fi
          website=false
          payment=false
          case "$INPUT" in
            all) website=true; payment=true ;;
            website) website=true ;;
            payment) payment=true ;;
          esac
          # Path-filtered pushes always deploy both apps listed in `paths`
          # (either may have changed; building both keeps hosts in sync).
          if [ "${{ github.event_name }}" = "push" ]; then
            website=true
            payment=true
          fi
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "payment=$payment" >> "$GITHUB_OUTPUT"

  website:
    name: Website · Cloudflare Pages
    needs: resolve
    if: needs.resolve.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://getcaremate.com' }}
      VITE_COMMUNITY_PORTAL_URL: ${{ vars.VITE_COMMUNITY_PORTAL_URL || 'https://community.getcaremate.com' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_WEBSITE || 'caremate-website' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name} on GitHub Environment 'prod'."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run website:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy caremate-website/dist --project-name=${{ env.CF_PROJECT }} --branch=prod
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Website (prod)"
            echo ""
            echo "- Project: \`${CF_PROJECT}\`"
            echo "- Branch: \`prod\` (Cloudflare production branch should match)"
            echo "- Host: \`${VITE_SITE_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  payment:
    name: Payment · Cloudflare Pages
    needs: resolve
    if: needs.resolve.outputs.payment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      VITE_SITE_URL: ${{ vars.VITE_PAYMENT_SITE_URL || 'https://pay.getcaremate.com' }}
      VITE_WEBSITE_URL: ${{ vars.VITE_WEBSITE_URL || 'https://getcaremate.com' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_PAYMENT || 'caremate-payment' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name} on GitHub Environment 'prod'."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install dependencies
        run: npm ci

      - name: Build payment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run payment:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy caremate-payment-gateway/dist --project-name=${{ env.CF_PROJECT }} --branch=prod
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Payment (prod)"
            echo ""
            echo "- Project: \`${CF_PROJECT}\`"
            echo "- Branch: \`prod\` (Cloudflare production branch should match)"
            echo "- Host: \`${VITE_SITE_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
