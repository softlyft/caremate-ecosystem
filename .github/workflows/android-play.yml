# Production Play release — manual dispatch only (GitHub Actions, no EAS).
# Sideload APKs on main: .github/workflows/mobile-main-cd.yml
#
# Required secrets: caremate-mobile/docs/play-android-release.md
name: Android Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track
        required: true
        type: choice
        default: production
        options:
          - internal
          - alpha
          - beta
          - production
      upload:
        description: Upload the AAB to Play after a successful build
        required: true
        type: boolean
        default: true
      publish_production:
        description: If track is production, complete the release (otherwise draft)
        required: false
        type: boolean
        default: false
      version_code:
        description: Override Android versionCode (leave empty to use run number + offset)
        required: false
        type: string
        default: ''

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  play:
    name: AAB · Sign · Play
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    permissions:
      contents: read

    env:
      PLAY_TRACK: ${{ github.event_name != 'workflow_dispatch' && 'production' || inputs.track }}
      PLAY_UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
      PLAY_PUBLISH_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_production || false }}
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_APP_ENV: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WEBSITE_URL: ${{ secrets.EXPO_PUBLIC_WEBSITE_URL }}
      EXPO_PUBLIC_COMMUNITY_PORTAL_URL: ${{ secrets.EXPO_PUBLIC_COMMUNITY_PORTAL_URL }}
      EXPO_PUBLIC_PAYMENT_URL: ${{ secrets.EXPO_PUBLIC_PAYMENT_URL }}
      EXPO_PUBLIC_HEALTH_DATA_GATEWAY_URL: ${{ secrets.EXPO_PUBLIC_HEALTH_DATA_GATEWAY_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
      EXPO_PUBLIC_ADMOB_APP_ID_ANDROID: ${{ secrets.EXPO_PUBLIC_ADMOB_APP_ID_ANDROID }}
      EXPO_PUBLIC_ADMOB_APP_ID_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_APP_ID_IOS }}
      EXPO_PUBLIC_ADMOB_BANNER_UNIT_IOS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_UNIT_IOS }}
      EXPO_PUBLIC_ADMOB_BANNER_HOME_TIPS: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_HOME_TIPS }}
      EXPO_PUBLIC_ADMOB_BANNER_HOME_FEED: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_HOME_FEED }}
      EXPO_PUBLIC_ADMOB_BANNER_LEARN_LIST: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_LEARN_LIST }}
      EXPO_PUBLIC_ADMOB_BANNER_LEARN_ARTICLE_HEADER: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_LEARN_ARTICLE_HEADER }}
      EXPO_PUBLIC_ADMOB_BANNER_LEARN_ARTICLE_FOOTER: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_LEARN_ARTICLE_FOOTER }}
      EXPO_PUBLIC_ADMOB_BANNER_NEARBY_LIST: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_NEARBY_LIST }}
      EXPO_PUBLIC_ADMOB_BANNER_NEARBY_PROVIDER: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_NEARBY_PROVIDER }}
      EXPO_PUBLIC_ADMOB_BANNER_PREGNANCY_TIMELINE: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_PREGNANCY_TIMELINE }}
      EXPO_PUBLIC_ADMOB_BANNER_PREGNANCY_FOOTER: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_PREGNANCY_FOOTER }}
      EXPO_PUBLIC_ADMOB_BANNER_PERIOD_WEEK: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_PERIOD_WEEK }}
      EXPO_PUBLIC_ADMOB_BANNER_PERIOD_FOOTER: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_PERIOD_FOOTER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Sentry upload
        run: |
          set -euo pipefail
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
            echo "Sentry source-map upload enabled."
          else
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
            echo "SENTRY_AUTH_TOKEN unset — skipping Sentry upload."
          fi

      - name: Assert production mobile env
        run: |
          set -euo pipefail
          chmod +x caremate-mobile/scripts/assert-production-mobile-env.sh
          caremate-mobile/scripts/assert-production-mobile-env.sh

      - name: Require Play signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD: ${{ env.PLAY_UPLOAD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$UPLOAD" = "True" ] || [ "$UPLOAD" = "true" ]; then
            if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
              echo "Missing secret: PLAY_SERVICE_ACCOUNT_JSON on GitHub Environment production"
              echo "Copy it from the development environment (or Play Console service account JSON)."
              missing=1
            fi
          fi
          if [ "$missing" -ne 0 ]; then
            echo "See caremate-mobile/docs/play-android-release.md"
            exit 1
          fi

      - name: Resolve versionCode
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION_CODE}" ]; then
            CODE="${INPUT_VERSION_CODE}"
          else
            BASE="${OFFSET:-0}"
            CODE=$((BASE + GITHUB_RUN_NUMBER))
          fi
          if ! [[ "$CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid ANDROID_VERSION_CODE: $CODE"
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          VERSION_NAME="$(node -p "require('./caremate-mobile/app.json').expo.version")"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Using versionName=$VERSION_NAME versionCode=$CODE"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prune nested package stubs
        run: npm run prune:module-stubs -w caremate-mobile

      - name: Generate native Android project
        working-directory: caremate-mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ensure release signing in app/build.gradle
        run: |
          set -euo pipefail
          chmod +x caremate-mobile/scripts/patch-android-release-signing.js
          node caremate-mobile/scripts/patch-android-release-signing.js
          grep -q 'CARE_MATE_UPLOAD_STORE_FILE' caremate-mobile/android/app/build.gradle

      - name: Write upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > caremate-mobile/android/upload-keystore.jks
          test -s caremate-mobile/android/upload-keystore.jks

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "CARE_MATE_UPLOAD_STORE_FILE=upload-keystore.jks"
            echo "CARE_MATE_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "CARE_MATE_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "CARE_MATE_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> caremate-mobile/android/gradle.properties

      - name: Build release AAB
        working-directory: caremate-mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -PCARE_MATE_UPLOAD_STORE_FILE=upload-keystore.jks \
            -PCARE_MATE_UPLOAD_STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" \
            -PCARE_MATE_UPLOAD_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
            -PCARE_MATE_UPLOAD_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"

      - name: Stage AAB
        id: aab
        run: |
          set -euo pipefail
          SRC="caremate-mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$SRC" ]; then
            echo "AAB not found at $SRC"
            find caremate-mobile/android/app/build/outputs -type f -name '*.aab' || true
            exit 1
          fi
          NAME="CareMate-${ANDROID_VERSION_CODE}.aab"
          mkdir -p artifacts
          cp "$SRC" "artifacts/$NAME"
          ls -lh "artifacts/$NAME"
          echo "aab_path=artifacts/$NAME" >> "$GITHUB_OUTPUT"

      - name: Reject debug-signed AAB
        run: |
          set -euo pipefail
          AAB="${{ steps.aab.outputs.aab_path }}"
          # AABs are zips; signing certs live under META-INF.
          CERT_FILE="$(unzip -l "$AAB" | awk '/META-INF\/.*\.(RSA|DSA|EC)$/ { print $4; exit }')"
          if [ -z "${CERT_FILE:-}" ]; then
            echo "::warning::No META-INF signing cert entry found in AAB; continuing (Play will still validate)."
          else
            CERT_INFO="$(unzip -p "$AAB" "$CERT_FILE" | keytool -printcert 2>/dev/null || true)"
            echo "$CERT_INFO" | head -n 40
            if echo "$CERT_INFO" | grep -qi 'CN=Android Debug'; then
              echo "::error::AAB is signed with the Android debug keystore. Play rejects this."
              echo "Ensure CARE_MATE_UPLOAD_* secrets are set and release signing was patched."
              exit 1
            fi
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: caremate-android-aab
          path: ${{ steps.aab.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Validate Play service account JSON
        if: ${{ env.PLAY_UPLOAD != 'false' && env.PLAY_UPLOAD != false }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is empty on GitHub Environment production."
            exit 1
          fi
          # Detect common paste mistakes before the Play action's opaque error.
          if ! node -e '
            const raw = process.env.PLAY_SERVICE_ACCOUNT_JSON;
            let parsed;
            try { parsed = JSON.parse(raw); } catch (e) {
              console.error("PLAY_SERVICE_ACCOUNT_JSON is not valid JSON:", e.message);
              console.error("Paste the raw service-account key file contents (starts with {\"type\":\"service_account\"...}).");
              console.error("Do not base64-encode it, and do not wrap the whole JSON in extra quotes.");
              process.exit(1);
            }
            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
              console.error("PLAY_SERVICE_ACCOUNT_JSON must be a JSON object.");
              process.exit(1);
            }
            if (typeof parsed.client_email !== "string" || !parsed.client_email.includes("@")) {
              console.error("JSON is missing client_email. You likely pasted the wrong file or truncated JSON.");
              console.error("Keys present:", Object.keys(parsed).join(", ") || "(none)");
              process.exit(1);
            }
            if (parsed.type !== "service_account") {
              console.error("Expected type=service_account, got:", parsed.type);
              process.exit(1);
            }
            console.log("Play service account OK:", parsed.client_email);
          '; then
            echo "See caremate-mobile/docs/play-android-release.md#play-upload-required-to-publish-the-aab"
            exit 1
          fi

      - name: Upload to Play Console
        if: ${{ env.PLAY_UPLOAD != 'false' && env.PLAY_UPLOAD != false }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.softlyft.caremate
          releaseFiles: ${{ steps.aab.outputs.aab_path }}
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_TRACK == 'production' && env.PLAY_PUBLISH_PRODUCTION != 'true' && env.PLAY_PUBLISH_PRODUCTION != true && 'draft' || 'completed' }}
          releaseName: ${{ format('{0} ({1})', env.VERSION_NAME, env.ANDROID_VERSION_CODE) }}
          changesNotSentForReview: true
