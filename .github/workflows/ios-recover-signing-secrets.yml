# ONE-SHOT recovery: download development iOS signing + ASC API secrets as an artifact.
# Delete this workflow and the workflow run after copying secrets into production.
# Do not leave this enabled long-term.
name: iOS Recover Signing Secrets

on:
  workflow_dispatch:

concurrency:
  group: ios-recover-signing-secrets
  cancel-in-progress: false

jobs:
  export:
    name: Export development signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    permissions:
      contents: read
      actions: write

    steps:
      - name: Write secrets to files
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_API_KEY_P8 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing secret on environment development: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p recover
          # Write via printf (no echo) so values are not printed to the job log.
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" >recover/IOS_DISTRIBUTION_CERTIFICATE_BASE64.txt
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" >recover/IOS_DISTRIBUTION_CERTIFICATE_PASSWORD.txt
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" >recover/APP_STORE_CONNECT_API_KEY_P8.txt
          printf '%s' "$APP_STORE_CONNECT_KEY_ID" >recover/APP_STORE_CONNECT_KEY_ID.txt
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" >recover/APP_STORE_CONNECT_ISSUER_ID.txt

          cat >recover/README.txt <<'EOF'
          ONE-SHOT recovery artifact from GitHub Environment "development".

          Copy onto Environment "production":

          Signing (same Distribution cert for both lanes):
            - IOS_DISTRIBUTION_CERTIFICATE_BASE64
            - IOS_DISTRIBUTION_CERTIFICATE_PASSWORD

          App Store Connect upload (fixes DECODER routines::unsupported):
            - APP_STORE_CONNECT_API_KEY_P8  (must include BEGIN/END PRIVATE KEY lines)
            - APP_STORE_CONNECT_KEY_ID
            - APP_STORE_CONNECT_ISSUER_ID

          Keep production IOS_PROVISIONING_PROFILE_BASE64 as the App Store profile
          for com.softlyft.caremate (do not reuse the .dev profile).

          Delete this workflow run + artifact, then remove
          .github/workflows/ios-recover-signing-secrets.yml and rotate later.
          EOF

          # Confirm sizes only (not contents)
          wc -c recover/*

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-signing-secrets-development
          path: recover/
          if-no-files-found: error
          retention-days: 1
