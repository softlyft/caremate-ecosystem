# Deploy Health Data Gateway Lambda.
# - Push/merge to main  → GitHub Environment "development" → stack caremate-health-data-gateway-development
# - Push/merge to prod  → GitHub Environment "production"  → stack caremate-health-data-gateway-prod
#
# Create GitHub Environments named `development` and `production`, each with secrets below.
# Auth today: IAM user access keys (OIDC can replace this later).
#
# IMPORTANT: secrets must be on the GitHub Environment (`development` / `production`),
# not only at repository level — this job uses `environment:`.
#
# Secrets (per environment):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_JWT_SECRET
#   GATEWAY_MASTER_KEY           — openssl rand -base64 32 (unique per env)
#
# Variables (optional, per environment):
#   AWS_REGION                   — default us-east-1
name: Gateway CD

on:
  push:
    branches:
      - main
      - prod
    paths:
      - 'caremate-health-data-gateway/**'
      - '.github/workflows/gateway-cd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment (AWS stack is development or prod)
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: gateway-cd-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      github_environment: ${{ steps.out.outputs.github_environment }}
      deploy_env: ${{ steps.out.outputs.deploy_env }}
    steps:
      - name: Pick GitHub Environment + AWS stack suffix
        id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            GH_ENV='${{ inputs.environment }}'
          elif [ '${{ github.ref }}' = 'refs/heads/prod' ]; then
            GH_ENV='production'
          else
            GH_ENV='development'
          fi

          # SAM template AllowedValues: development | prod
          if [ "$GH_ENV" = 'production' ]; then
            DEPLOY_ENV='prod'
          else
            DEPLOY_ENV='development'
          fi

          echo "github_environment=$GH_ENV" >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "Resolved GitHub env=$GH_ENV AWS EnvironmentName=$DEPLOY_ENV"

  deploy:
    name: Deploy · ${{ needs.resolve.outputs.github_environment }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ needs.resolve.outputs.github_environment }}
    env:
      GITHUB_ENVIRONMENT: ${{ needs.resolve.outputs.github_environment }}
      DEPLOY_ENV: ${{ needs.resolve.outputs.deploy_env }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      STACK_NAME: caremate-health-data-gateway-${{ needs.resolve.outputs.deploy_env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify environment secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GATEWAY_MASTER_KEY: ${{ secrets.GATEWAY_MASTER_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET GATEWAY_MASTER_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name} on GitHub Environment '${GITHUB_ENVIRONMENT}'. Add it under Settings → Environments → ${GITHUB_ENVIRONMENT} → Environment secrets (repo-level secrets are not visible to this job)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required environment secrets are present for ${GITHUB_ENVIRONMENT} (AWS stack ${STACK_NAME})."

      - name: Install dependencies
        run: npm ci

      - name: Test gateway
        run: npm run gateway:test

      - name: Build Lambda bundle
        run: npm run gateway:build:lambda

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete failed stack if stuck in ROLLBACK_COMPLETE
        env:
          SAM_CLI_TELEMETRY: '0'
        run: |
          set -euo pipefail
          STATUS="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo 'DOES_NOT_EXIST')"
          echo "Current stack status: ${STATUS}"
          case "${STATUS}" in
            ROLLBACK_COMPLETE|ROLLBACK_FAILED|CREATE_FAILED|DELETE_FAILED)
              echo "Deleting unrecoverable stack ${STACK_NAME} (${STATUS})..."
              aws cloudformation delete-stack --stack-name "${STACK_NAME}"
              aws cloudformation wait stack-delete-complete --stack-name "${STACK_NAME}"
              echo "Stack deleted."
              ;;
            DOES_NOT_EXIST)
              echo "No existing stack — fresh create."
              ;;
            *)
              echo "Stack is updatable (${STATUS})."
              ;;
          esac

      - name: Sam deploy
        working-directory: caremate-health-data-gateway
        env:
          SAM_CLI_TELEMETRY: '0'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GATEWAY_MASTER_KEY: ${{ secrets.GATEWAY_MASTER_KEY }}
        run: |
          set -euo pipefail
          # Artifact already built by esbuild into dist-lambda/ (CodeUri).
          sam deploy \
            --template-file template.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "EnvironmentName=${DEPLOY_ENV}" \
              "SupabaseUrl=${SUPABASE_URL}" \
              "SupabaseServiceRoleKey=${SUPABASE_SERVICE_ROLE_KEY}" \
              "SupabaseJwtSecret=${SUPABASE_JWT_SECRET}" \
              "GatewayMasterKey=${GATEWAY_MASTER_KEY}"

      - name: Print API endpoint
        working-directory: caremate-health-data-gateway
        run: |
          set -euo pipefail
          ENDPOINT="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" \
            --output text)"
          {
            echo "## Gateway ${GITHUB_ENVIRONMENT}"
            echo ""
            echo "- GitHub Environment: \`${GITHUB_ENVIRONMENT}\`"
            echo "- AWS EnvironmentName: \`${DEPLOY_ENV}\`"
            echo "- Stack: \`${STACK_NAME}\`"
            echo "- Endpoint: \`${ENDPOINT}\`"
            echo "- Mobile: set \`EXPO_PUBLIC_HEALTH_DATA_GATEWAY_URL=${ENDPOINT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed ${GITHUB_ENVIRONMENT} → ${ENDPOINT}"
