# Test release pipeline:
# GitHub → GitHub Actions → Expo EAS Build
#   ├── Internal Android  (APK / internal distribution)
#   ├── TestFlight        (iOS store build + auto-submit)
#   └── Staging           (Android + iOS internal / staging channel)
name: EAS Test Release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Which EAS targets to run
        required: true
        type: choice
        default: all
        options:
          - all
          - internal-android
          - testflight
          - staging
      wait_for_build:
        description: Wait for EAS builds to finish (slower CI, billed runner time)
        required: false
        type: boolean
        default: false

  push:
    branches:
      - staging
    paths:
      - 'caremate/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/eas-test-release.yml'
    tags:
      - 'test-release/*'

concurrency:
  group: eas-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Format · Lint · Typecheck · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caremate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          CI: true

  resolve-targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      internal_android: ${{ steps.targets.outputs.internal_android }}
      testflight: ${{ steps.targets.outputs.testflight }}
      staging: ${{ steps.targets.outputs.staging }}
      wait_flag: ${{ steps.targets.outputs.wait_flag }}
    steps:
      - name: Decide which builds to trigger
        id: targets
        run: |
          INPUT="${{ github.event.inputs.targets }}"
          if [ -z "$INPUT" ]; then
            INPUT="all"
          fi

          internal_android=false
          testflight=false
          staging=false

          case "$INPUT" in
            all)
              internal_android=true
              testflight=true
              staging=true
              ;;
            internal-android)
              internal_android=true
              ;;
            testflight)
              testflight=true
              ;;
            staging)
              staging=true
              ;;
          esac

          # Tag / staging-branch pushes always run the full test-release set.
          if [ "${{ github.event_name }}" = "push" ]; then
            internal_android=true
            testflight=true
            staging=true
          fi

          wait_flag="--no-wait"
          if [ "${{ github.event.inputs.wait_for_build }}" = "true" ]; then
            wait_flag=""
          fi

          echo "internal_android=$internal_android" >> "$GITHUB_OUTPUT"
          echo "testflight=$testflight" >> "$GITHUB_OUTPUT"
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "wait_flag=$wait_flag" >> "$GITHUB_OUTPUT"

  internal-android:
    name: Internal Android
    needs: [gate, resolve-targets]
    if: needs.resolve-targets.outputs.internal_android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caremate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: EAS Build (internal-android)
        run: |
          WAIT_FLAG="${{ needs.resolve-targets.outputs.wait_flag }}"
          eas build \
            --platform android \
            --profile internal-android \
            --non-interactive \
            $WAIT_FLAG

  testflight:
    name: TestFlight
    needs: [gate, resolve-targets]
    if: needs.resolve-targets.outputs.testflight == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caremate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Write App Store Connect API key
        env:
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          if [ -z "$EXPO_ASC_API_KEY_P8" ]; then
            echo "EXPO_ASC_API_KEY_P8 not set; relying on existing EAS Apple credentials."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY_PATH"
          echo "EXPO_ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: EAS Build + submit to TestFlight
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
        run: |
          WAIT_FLAG="${{ needs.resolve-targets.outputs.wait_flag }}"
          eas build \
            --platform ios \
            --profile testflight \
            --non-interactive \
            --auto-submit \
            $WAIT_FLAG

  staging:
    name: Staging
    needs: [gate, resolve-targets]
    if: needs.resolve-targets.outputs.staging == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caremate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: EAS Build (staging · Android + iOS)
        run: |
          WAIT_FLAG="${{ needs.resolve-targets.outputs.wait_flag }}"
          eas build \
            --platform all \
            --profile staging \
            --non-interactive \
            $WAIT_FLAG
