# Main-branch mobile CD: runs after CI passes on main/master.
# Gate: CI green + mobile-related paths changed → Android APK artifact + iOS TestFlight.
#
# Manual iOS-only: .github/workflows/ios-testflight.yml
# Prod store releases: ios-app-store.yml + android-play.yml (prod branch)
name: Mobile Main CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: mobile-main-cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate · CI passed · mobile paths
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect mobile changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'caremate-mobile/**'
              - 'packages/**'
              - 'patches/**'
              - '.github/workflows/mobile-main-cd.yml'
              - '.github/workflows/ios-testflight.yml'

      - name: Decide whether to deploy
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — deploying mobile."
          elif [ "${{ steps.filter.outputs.mobile }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "CI passed and mobile paths changed — deploying."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "CI passed but no mobile paths changed — skipping mobile CD."
          fi

      - name: Resolve build SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

  android-apk:
    name: Android APK · Artifact
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      BUILD_SHA: ${{ needs.gate.outputs.sha }}
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prune nested package stubs
        run: npm run prune:module-stubs -w caremate-mobile

      - name: Generate native Android project
        working-directory: caremate-mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: caremate-mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          SRC="caremate-mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "APK not found at $SRC"
            find caremate-mobile/android/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          SHA7="$(echo "$BUILD_SHA" | cut -c1-7)"
          NAME="CareMate-${SHA7}.apk"
          mkdir -p artifacts
          cp "$SRC" "artifacts/$NAME"
          ls -lh "artifacts/$NAME"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caremate-android-apk
          path: artifacts/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

  ios-testflight:
    name: iOS TestFlight
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    uses: ./.github/workflows/ios-testflight.yml
    with:
      build_sha: ${{ needs.gate.outputs.sha }}
      upload: true
      build_number: ''
    secrets: inherit
