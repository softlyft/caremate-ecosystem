[project]
name = "caremate-provider-ingestion"
version = "0.1.0"
description = "CareMate provider CSV/XLSX ingestion (FHIR-ready, Lambda-compatible handlers)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pandas>=2.2.0",
  "openpyxl>=3.1.5",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
caremate-ingest = "app.main:run"
