version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --prefix ..
    build:
      commands:
        - echo "VITE_SUPABASE_URL set:" && test -n "$VITE_SUPABASE_URL" && echo yes || (echo "Missing VITE_SUPABASE_URL" && exit 1)
        - echo "VITE_SUPABASE_ANON_KEY set:" && test -n "$VITE_SUPABASE_ANON_KEY" && echo yes || (echo "Missing VITE_SUPABASE_ANON_KEY" && exit 1)
        - npm run payment:build --prefix ..
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - ../node_modules/**/*
