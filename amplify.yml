version: 1

# Monorepo: each Amplify app sets AMPLIFY_MONOREPO_APP_ROOT in Console.
# scripts/amplify-build-guard.sh skips npm ci / compile when appRoot is unchanged.
# Use "run" so later phase commands are not executed after a skip (exit 0 alone does not stop Amplify).
env:
  variables:
    AMPLIFY_DIFF_DEPLOY: 'true'

applications:
  - appRoot: caremate-community-portal
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - bash scripts/amplify-build-guard.sh check
            - bash scripts/amplify-build-guard.sh run bash scripts/amplify-install.sh
        build:
          commands:
            - bash scripts/amplify-build-guard.sh run bash -c "env | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_WEBSITE_URL)=' > caremate-community-portal/.env.production && npm run build --workspace=caremate-community-portal"
        postBuild:
          commands:
            - bash scripts/amplify-build-guard.sh record
      artifacts:
        baseDirectory: caremate-community-portal/.next
        files:
          - "**/*"
      cache:
        paths:
          - caremate-community-portal/.next/cache/**/*
          - node_modules/**/*

  - appRoot: caremate-admin-portal
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - bash scripts/amplify-build-guard.sh check
            - bash scripts/amplify-build-guard.sh run bash scripts/amplify-install.sh
        build:
          commands:
            - bash scripts/amplify-build-guard.sh run bash -c "env | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|PROVIDER_INGEST_URL|PROVIDER_INGEST_API_KEY|CURRENTS_API_KEY|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_WEBSITE_URL|SENTRY_DSN|SENTRY_ENVIRONMENT)=' > caremate-admin-portal/.env.production && npm run build --workspace=caremate-admin-portal"
        postBuild:
          commands:
            - bash scripts/amplify-build-guard.sh record
      artifacts:
        baseDirectory: caremate-admin-portal/.next
        files:
          - "**/*"
      cache:
        paths:
          - caremate-admin-portal/.next/cache/**/*
          - node_modules/**/*

  - appRoot: caremate-provider-portal
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - bash scripts/amplify-build-guard.sh check
            - bash scripts/amplify-build-guard.sh run bash scripts/amplify-install.sh
        build:
          commands:
            - bash scripts/amplify-build-guard.sh run bash -c "env | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_WEBSITE_URL)=' > caremate-provider-portal/.env.production && npm run build --workspace=caremate-provider-portal"
        postBuild:
          commands:
            - bash scripts/amplify-build-guard.sh record
      artifacts:
        baseDirectory: caremate-provider-portal/.next
        files:
          - "**/*"
      cache:
        paths:
          - caremate-provider-portal/.next/cache/**/*
          - node_modules/**/*

  - appRoot: caremate-payment-gateway
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - bash scripts/amplify-build-guard.sh check
            - bash scripts/amplify-build-guard.sh run bash scripts/amplify-install.sh
        build:
          commands:
            - bash scripts/amplify-build-guard.sh run npm run build --workspace=caremate-payment-gateway
        postBuild:
          commands:
            - bash scripts/amplify-build-guard.sh record
      artifacts:
        baseDirectory: caremate-payment-gateway/dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*

  - appRoot: caremate-website
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - bash scripts/amplify-build-guard.sh check
            - bash scripts/amplify-build-guard.sh run bash scripts/amplify-install.sh
        build:
          commands:
            - bash scripts/amplify-build-guard.sh run npm run build --workspace=caremate-website
        postBuild:
          commands:
            - bash scripts/amplify-build-guard.sh record
      artifacts:
        baseDirectory: caremate-website/dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '/.well-known/apple-app-site-association'
          headers:
            - key: 'Content-Type'
              value: 'application/json'
        - pattern: '/.well-known/assetlinks.json'
          headers:
            - key: 'Content-Type'
              value: 'application/json'
